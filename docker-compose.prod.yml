services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: conversaiq/backend:latest
    container_name: conversaiq-backend-prod
    user: "10001:10001"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=conversaiq_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT=http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - conversaiq-prod-net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: conversaiq-postgres-prod
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=conversaiq_db
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
        reservations:
          cpus: '1.0'
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d conversaiq_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - conversaiq-prod-net

  redis:
    image: redis:7-alpine
    container_name: conversaiq-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_prod_data:/data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - conversaiq-prod-net

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: conversaiq/celery-worker:latest
    container_name: conversaiq-celery-worker-prod
    user: "10001:10001"
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - POSTGRES_SERVER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    depends_on:
      - redis
      - postgres
    command: celery -A app.core.celery worker --loglevel=info --concurrency=4
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    networks:
      - conversaiq-prod-net

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: conversaiq-minio-prod
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_USER:?MINIO_USER is required}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:?MINIO_PASSWORD is required}
    volumes:
      - minio_prod_data:/data
    command: server /data --console-address ":9001"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - conversaiq-prod-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: conversaiq/frontend:latest
    container_name: conversaiq-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - conversaiq-prod-net

volumes:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:

networks:
  conversaiq-prod-net:
    driver: bridge
