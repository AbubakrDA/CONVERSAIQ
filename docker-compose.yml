services:
  # 1. FastAPI Application Gateway
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: conversaiq-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=conversaiq_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT=http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # 2. PostgreSQL 16 with pgvector Extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: conversaiq-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=conversaiq_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d conversaiq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Redis 7 Cache & Celery Task Broker
  redis:
    image: redis:7-alpine
    container_name: conversaiq-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Celery Distributed Task Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: conversaiq-celery-worker
    environment:
      - ENVIRONMENT=development
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
    depends_on:
      - redis
      - postgres
    command: celery -A app.core.celery worker --loglevel=info

  # 5. MinIO S3-Compatible Private Object Storage
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: conversaiq-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # 6. React 18 Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: conversaiq-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
